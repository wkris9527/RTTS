name: Reproducibility report
description: Report an installation issue or a discrepancy in evaluation.
body:
  - type: textarea
    attributes:
      label: Environment and commit
      description: Include the Git commit and scripts/check_environment.py output. Redact personal paths.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Command and dataset
      description: Include the command, benchmark, split, label preparation, and checkpoint information.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Observed behavior
      description: Include expected/observed scores or the relevant error excerpt.
    validations:
      required: true
