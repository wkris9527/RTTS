name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lightweight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m compileall -q adapt ovss utils_local sam2 scripts main.py
      - run: python scripts/run.py --benchmark cityscapes --data-dir ./data/cityscapes --dry-run
  tensor-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4
      - run: python -m pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p 'test_refinement.py' -v
